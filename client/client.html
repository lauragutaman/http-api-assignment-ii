<!DOCTYPE html>
<html lang="en">

<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">

  <script>

    const handleResponse = async (response, parseJson) => {
      const content = document.querySelector('#content');

      switch (response.status) {
        case 200:
          content.innerHTML = '<b>Success</b>';
          break;
        case 201:
          content.innerHTML = '<b>Created</b>';
          break;
        case 204:
          content.innerHTML = '<b>Updated</b>';
          break;
        case 400:
          content.innerHTML = '<b>Bad Request</b>';
          break;
        case 404:
          content.innerHTML = '<b> Resource Not Found</b>';
          break;
        default:
          content.innerHTML = `<b>Status Code: ${response.status}</b>`
          break;
      }

      if (parseJson) {
        const obj = await response.json();
        content.innerHTML += `<p>${JSON.stringify(obj)}</p>`
      }
    };

    const requestUpdate = async (userForm) => {
      const url = userForm.querySelector('#urlField').value;
      const method = userForm.querySelector('#methodSelect').value.toUpperCase();

      const response = await fetch(url, {
        method: method,
        headers: {
          'Accept': 'application/json'
        }
      });

      const parseJson = method !== 'HEAD';
      handleResponse(response, parseJson);
    };

    const requestAddUser = async (nameForm) => {
      const name = nameForm.querySelector('#nameField').value;
      const age = nameForm.querySelector('#ageField').value;

      const response = await fetch('/addUser', {
        method: 'POST',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ name, age })
      });

      const parseJson = response.status !== 204;
      handleResponse(response, parseJson);
    };

    const init = () => {
      const nameForm = document.querySelector('#nameForm');
      nameForm.addEventListener('submit', (e) => {
        e.preventDefault();
        requestAddUser(nameForm);
      });

      const userForm = document.querySelector('#userForm');
      userForm.addEventListener('submit', (e) => {
        e.preventDefault();
        requestUpdate(userForm);
      });
    };

    window.onload = init; 
  </script>
</head>

<body>
  <section id="top">
    <h3>POST Status Code Tests</h3>
    <form id="nameForm" action="/addUser" method="post">
      <label for="name">Name: </label>
      <input id="nameField" type="text" name="name" />
      <label for="age">Age: </label>
      <input id="ageField" type="number" name="age" min="0" max="100" step="1" />
      <input type="submit" value="Add User" />
    </form>
    <form id="userForm" action="/getUsers" method="get">
      <select id='urlField'>
        <option value='/getUsers'>/getUsers</option>
        <option value='/notReal'>/notReal</option>
      </select>
      <select id="methodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get User" />
    </form>
  </section>
  <section id="content">
  </section>
</body>

</html>
